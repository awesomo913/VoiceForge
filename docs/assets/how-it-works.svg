<svg viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="How VoiceForge works: record or load a clip, run DSP and AI effects, preview it, export a WAV — nothing leaves your computer">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9b5de5"/>
      <stop offset="100%" stop-color="#00d4aa"/>
    </linearGradient>
    <g id="arrow">
      <line x1="0" y1="0" x2="132" y2="0" stroke="#5c3d99" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
      <path d="M 124 -8 L 136 0 L 124 8" stroke="#00d4aa" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>

  <rect width="1200" height="280" fill="#14141f"/>

  <text x="600" y="40" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600" fill="#8a8aa3" letter-spacing="1.5" text-anchor="middle">EVERYTHING RUNS ON YOUR PC — NOTHING LEAVES YOUR COMPUTER</text>

  <!-- arrows between steps -->
  <use href="#arrow" x="204" y="130"/>
  <use href="#arrow" x="504" y="130"/>
  <use href="#arrow" x="804" y="130"/>

  <g font-family="Segoe UI, system-ui, sans-serif" text-anchor="middle">
    <!-- 1 Record or load -->
    <g transform="translate(150,130)">
      <circle r="48" fill="#1e1e2e" stroke="url(#g)" stroke-width="3"/>
      <rect x="-9" y="-22" width="18" height="28" rx="9" fill="none" stroke="#f5f7fa" stroke-width="3"/>
      <path d="M -17 2 a 17 17 0 0 0 34 0" stroke="#f5f7fa" stroke-width="3" fill="none" stroke-linecap="round"/>
      <line x1="0" y1="19" x2="0" y2="26" stroke="#f5f7fa" stroke-width="3" stroke-linecap="round"/>
      <text y="82" font-size="19" font-weight="600" fill="#f5f7fa">1 · Record or load</text>
      <text y="104" font-size="13" fill="#a9b4c4">mic input, or an audio file</text>
    </g>
    <!-- 2 DSP + AI -->
    <g transform="translate(450,130)">
      <circle r="48" fill="#1e1e2e" stroke="url(#g)" stroke-width="3"/>
      <path d="M -20 10 L -10 -14 L 0 6 L 10 -18 L 20 10" fill="none" stroke="#f5f7fa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="82" font-size="19" font-weight="600" fill="#f5f7fa">2 · DSP + AI effects</text>
      <text y="104" font-size="13" fill="#a9b4c4">pitch, reverb, noise cleanup…</text>
    </g>
    <!-- 3 Preview -->
    <g transform="translate(750,130)">
      <circle r="48" fill="#1e1e2e" stroke="url(#g)" stroke-width="3"/>
      <path d="M -14 -18 L -14 18 L 18 0 Z" fill="#f5f7fa"/>
      <text y="82" font-size="19" font-weight="600" fill="#f5f7fa">3 · Preview</text>
      <text y="104" font-size="13" fill="#a9b4c4">hear it before you export</text>
    </g>
    <!-- 4 Export WAV -->
    <g transform="translate(1050,130)">
      <circle r="48" fill="#1e1e2e" stroke="url(#g)" stroke-width="3"/>
      <path d="M -16 -20 L 6 -20 L 16 -10 L 16 20 L -16 20 Z" fill="none" stroke="#f5f7fa" stroke-width="3"/>
      <line x1="-8" y1="-4" x2="8" y2="-4" stroke="#f5f7fa" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-8" y1="4" x2="8" y2="4" stroke="#f5f7fa" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-8" y1="12" x2="2" y2="12" stroke="#f5f7fa" stroke-width="2.5" stroke-linecap="round"/>
      <text y="82" font-size="19" font-weight="600" fill="#f5f7fa">4 · Export WAV</text>
      <text y="104" font-size="13" fill="#a9b4c4">24-bit, 48 kHz file</text>
    </g>
  </g>
</svg>
