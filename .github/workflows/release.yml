name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Build VoiceForge.exe
        # Note: this does NOT vendor the optional rubberband CLI (see
        # THIRD_PARTY.md / vendor/README.md) — that's a manual, human-verified
        # step this pipeline deliberately doesn't automate. build.py detects
        # its absence and proceeds normally; formant shift uses pedalboard's
        # pitch-only fallback in exes built by this workflow.
        run: python build.py

      - name: Compute SHA256
        shell: bash
        run: |
          cd dist
          sha256sum VoiceForge.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/VoiceForge.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
